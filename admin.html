<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="admin-app" class="max-w-6xl mx-auto p-6">
    <header class="flex justify-between items-center pb-6 border-b border-slate-800">
      <h1 class="text-2xl font-bold text-indigo-400">Admin Control Center</h1>
      <span class="px-3 py-1 bg-indigo-900/60 text-indigo-300 rounded-full text-xs font-semibold">Admin View</span>
    </header>

    <main class="mt-6">
      <div id="data-container" class="space-y-4">
        <!-- Live synced items will render here -->
      </div>
    </main>
  </div>

  <script>
    // Paste your exact firebaseConfig here
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Real-time listener: changes made by client or admin reflect instantly
    db.collection("shared_records").onSnapshot((snapshot) => {
      const container = document.getElementById("data-container");
      container.innerHTML = "";
      snapshot.forEach((doc) => {
        const item = doc.data();
        const el = document.createElement("div");
        el.className = "p-4 bg-slate-800 rounded-lg border border-slate-700 flex justify-between items-center";
        el.innerHTML = `
          <div>
            <p class="font-medium text-white">${item.title || 'Record'}</p>
            <p class="text-xs text-slate-400">Status: <span class="text-emerald-400">${item.status || 'Active'}</span></p>
          </div>
          <button onclick="updateRecord('${doc.id}', '${item.status === 'Completed' ? 'Pending' : 'Completed'}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 rounded text-xs">
            Toggle Status
          </button>
        `;
        container.appendChild(el);
      });
    });

    window.updateRecord = async function(id, newStatus) {
      await db.collection("shared_records").doc(id).update({ status: newStatus });
    };
  </script>
</body>
</html>
